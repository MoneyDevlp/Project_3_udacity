version: 2.1

executors:
  docker-executor:
    docker:
      - image: docker:20.10

jobs:
  build:
    executor: docker-executor
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Build Docker images using Docker Compose
          command: |
            docker-compose -f docker-compose-build.yaml build
      - run:
          name: Login to DockerHub
          command: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
      - run:
          name: Tag and Push Docker images to DockerHub
          command: |
            docker tag reverseproxy levantienn/reverseproxy:v7
            docker tag udagram-api-user levantienn/udagram-api-user:v7
            docker tag udagram-api-feed levantienn/udagram-api-feed:v7
            docker tag udagram-frontend levantienn/udagram-frontend:v7
            docker push levantienn/reverseproxy:v7
            docker push levantienn/udagram-api-user:v7
            docker push levantienn/udagram-api-feed:v7
            docker push levantienn/udagram-frontend:v7
 
workflows:
  version: 2
  build-deploy:
    jobs:
      - build